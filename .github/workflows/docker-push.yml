name: Build and Push Django Image

# Το workflow ενεργοποιείται ΜΟΝΟ με το χέρι (όπως ζητάει η άσκηση)
on:
  workflow_dispatch:

env:
  IMAGE_NAME: django-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Βήμα 1: Κατέβασμα του κώδικα από το repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Βήμα 2: Login στο Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Βήμα 3: Ρύθμιση Docker Buildx (για καλύτερες επιδόσεις)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Βήμα 4: Build και push του image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./django           # Το path προς το Dockerfile
          push: true                   # Να ανέβει στο Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest